spring:
  application:
    name: gestion-de-tarifas

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/gestion_tarifas;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}